apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: library
type: Opaque
stringData:
  POSTGRES_USER: library
  POSTGRES_PASSWORD: library123
  POSTGRES_DB: librarydb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: library
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: db-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init
          configMap:
            name: db-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: library
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS members (id SERIAL PRIMARY KEY, name VARCHAR(100) NOT NULL, email VARCHAR(100) UNIQUE NOT NULL, member_type VARCHAR(20) DEFAULT 'student', joined_at DATE DEFAULT CURRENT_DATE);
    CREATE TABLE IF NOT EXISTS books (id SERIAL PRIMARY KEY, isbn VARCHAR(20) UNIQUE NOT NULL, title VARCHAR(200) NOT NULL, author VARCHAR(100) NOT NULL, category VARCHAR(50), total_copies INT NOT NULL DEFAULT 1, available_copies INT NOT NULL DEFAULT 1);
    CREATE TABLE IF NOT EXISTS issues (id SERIAL PRIMARY KEY, book_id INT NOT NULL REFERENCES books(id), member_id INT NOT NULL REFERENCES members(id), issue_date DATE DEFAULT CURRENT_DATE, due_date DATE NOT NULL, return_date DATE, fine NUMERIC(8,2) DEFAULT 0);
    INSERT INTO books (isbn,title,author,category,total_copies,available_copies) VALUES ('9780132350884','Clean Code','Robert C. Martin','Programming',3,3), ('9780135957059','The Pragmatic Programmer','Andrew Hunt','Programming',2,2) ON CONFLICT (isbn) DO NOTHING;
    INSERT INTO members (name,email,member_type) VALUES ('Asha Rao','asha@example.com','student'), ('Ravi Kumar','ravi@example.com','staff') ON CONFLICT (email) DO NOTHING;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: library
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
